plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
    id 'dev.yumi.gradle.licenser' version '2.2.2'
}

group = 'me.lucko'
version = '0.1.0-SNAPSHOT'

var hytaleVersion = '0.5.0'
var hytaleRepo = 'release'

repositories {
    mavenCentral()
    maven { url "https://maven.hytale.com/${hytaleRepo}/" }
    maven { url 'https://repo.helpch.at/releases/' }
}

processResources {
    filesMatching('manifest.json') {
        expand (
                'pluginVersion': project.version,
                'hytaleVersion': hytaleVersion
        )
    }
}

dependencies {
    // shaded
    implementation 'net.kyori:adventure-text-minimessage:4.26.1'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.26.1'

    // compile only
    compileOnly "com.hypixel.hytale:Server:$hytaleVersion"
    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'at.helpch:placeholderapi-hytale:1.0.6'

    // test
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.21.0'

    testImplementation "com.hypixel.hytale:Server:$hytaleVersion"
}

shadowJar {
    relocate 'net.kyori', 'me.lucko.minichatformatter.lib.kyori'
}

test {
    useJUnitPlatform()
    systemProperty 'java.util.logging.manager', 'com.hypixel.hytale.logger.backend.HytaleLogManager'
}

license {
    rule(file("HEADER.txt"))
}
